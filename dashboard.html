<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Analytics Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: white;
      border-radius: 10px;
      padding: 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2.5em;
    }

    .subtitle {
      color: #666;
      font-size: 1.1em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .card h2 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 1.5em;
    }

    .game-item {
      padding: 15px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .game-item:last-child {
      border-bottom: none;
    }

    .game-name {
      font-weight: 600;
      color: #333;
    }

    .game-genre {
      font-size: 0.9em;
      color: #999;
      margin-top: 5px;
    }

    .game-stats {
      text-align: right;
    }

    .visits {
      color: #667eea;
      font-weight: bold;
      font-size: 1.1em;
    }

    .players {
      color: #764ba2;
      font-size: 0.9em;
    }

    .trend {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 5px;
      margin-top: 10px;
      font-size: 0.85em;
      font-weight: 600;
    }

    .trend.up {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .trend.stable {
      background: #fff3e0;
      color: #e65100;
    }

    .metric-box {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .metric-label {
      color: #666;
      font-weight: 600;
    }

    .metric-value {
      color: #667eea;
      font-weight: bold;
    }

    .mechanic-item {
      padding: 15px;
      border-left: 4px solid #667eea;
      background: #f9f9f9;
      margin-bottom: 10px;
      border-radius: 4px;
    }

    .mechanic-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .mechanic-growth {
      display: inline-block;
      padding: 3px 8px;
      background: #e3f2fd;
      color: #1976d2;
      border-radius: 3px;
      font-size: 0.85em;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .mechanic-description {
      color: #666;
      font-size: 0.95em;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    footer {
      background: white;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      color: #666;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 Roblox Analytics Dashboard</h1>
      <p class="subtitle">Real data on what makes Roblox games succeed</p>
    </header>

    <div class="grid">
      <!-- Trending Games -->
      <div class="card">
        <h2>📊 Top Trending Games</h2>
        <div id="trending-games" class="loading">Loading...</div>
      </div>

      <!-- Games by Genre -->
      <div class="card">
        <h2>🎯 Games by Genre</h2>
        <div id="games-by-genre" class="loading">Loading...</div>
      </div>

      <!-- Success Metrics -->
      <div class="card">
        <h2>✨ What Makes Games Succeed</h2>
        <div id="success-metrics" class="loading">Loading...</div>
      </div>

      <!-- Trending Mechanics -->
      <div class="card">
        <h2>⚙️ Trending Game Mechanics</h2>
        <div id="trending-mechanics" class="loading">Loading...</div>
      </div>
    </div>

    <footer>
      <p>Last updated: <span id="update-time">just now</span> | 
      <a href="#" style="color: #667eea; text-decoration: none;">Sign up for alerts</a></p>
    </footer>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api';

    // Fetch and display trending games
    async function loadTrendingGames() {
      try {
        const res = await fetch(`${API_URL}/trending-games`);
        const games = await res.json();
        
        let html = '';
        games.slice(0, 5).forEach(game => {
          html += `
            <div class="game-item">
              <div>
                <div class="game-name">${game.name}</div>
                <div class="game-genre">${game.genre}</div>
              </div>
              <div class="game-stats">
                <div class="visits">${(game.visits / 1000000000).toFixed(1)}B visits</div>
                <div class="players">${game.players.toLocaleString()} players</div>
                <span class="trend ${game.monthlyTrend}">${game.monthlyTrend === 'up' ? '↑ Growing' : '→ Stable'}</span>
              </div>
            </div>
          `;
        });
        document.getElementById('trending-games').innerHTML = html;
      } catch (e) {
        document.getElementById('trending-games').innerHTML = '<p style="color: red;">Error loading data</p>';
      }
    }

    // Fetch and display games by genre
    async function loadGamesByGenre() {
      try {
        const res = await fetch(`${API_URL}/games-by-genre`);
        const data = await res.json();
        
        let html = '';
        Object.entries(data).forEach(([genre, games]) => {
          html += `<strong style="color: #667eea;">${genre}</strong><br>`;
          games.forEach(game => {
            html += `<div style="padding-left: 15px; margin-bottom: 8px;">• ${game.name} (${game.visits / 1000000000}B visits)</div>`;
          });
          html += '<br>';
        });
        document.getElementById('games-by-genre').innerHTML = html;
      } catch (e) {
        document.getElementById('games-by-genre').innerHTML = '<p style="color: red;">Error loading data</p>';
      }
    }

    // Fetch and display success metrics
    async function loadSuccessMetrics() {
      try {
        const res = await fetch(`${API_URL}/success-metrics`);
        const metrics = await res.json();
        
        let html = `
          <div class="metric-box">
            <span class="metric-label">Top Genres:</span>
            <span class="metric-value">${metrics.topGenres.join(', ')}</span>
          </div>
          <div class="metric-box">
            <span class="metric-label">Winning Game Avg:</span>
            <span class="metric-value">${(metrics.avgWinningVisits / 1000000000).toFixed(0)}B visits</span>
          </div>
          <div style="margin-top: 15px;">
            <strong style="color: #333; display: block; margin-bottom: 10px;">Common Winning Mechanics:</strong>
            ${metrics.commonMechanics.map(m => `<div style="padding: 8px; background: #f0f0f0; margin-bottom: 5px; border-radius: 4px;">✓ ${m}</div>`).join('')}
          </div>
        `;
        document.getElementById('success-metrics').innerHTML = html;
      } catch (e) {
        document.getElementById('success-metrics').innerHTML = '<p style="color: red;">Error loading data</p>';
      }
    }

    // Fetch and display trending mechanics
    async function loadTrendingMechanics() {
      try {
        const res = await fetch(`${API_URL}/trending-mechanics`);
        const mechanics = await res.json();
        
        let html = '';
        mechanics.forEach(mechanic => {
          html += `
            <div class="mechanic-item">
              <div class="mechanic-name">${mechanic.name}</div>
              <div class="mechanic-growth">${mechanic.growth} growth</div>
              <div class="mechanic-description">${mechanic.description}</div>
            </div>
          `;
        });
        document.getElementById('trending-mechanics').innerHTML = html;
      } catch (e) {
        document.getElementById('trending-mechanics').innerHTML = '<p style="color: red;">Error loading data</p>';
      }
    }

    // Load all data on page load
    window.addEventListener('load', () => {
      loadTrendingGames();
      loadGamesByGenre();
      loadSuccessMetrics();
      loadTrendingMechanics();
      document.getElementById('update-time').textContent = new Date().toLocaleTimeString();
    });
  </script>
</body>
</html>
